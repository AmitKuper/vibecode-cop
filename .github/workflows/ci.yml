name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Sync deps
        run: uv sync --frozen
      - name: Lock consistency
        run: uv lock --check
      - name: Run tests
        run: uv run pytest tests/ cop_worker/tests/ league_manager/tests/ -q --tb=short
      - name: Coverage
        # Real source packages after the 3-process restructure (agent/ -> cop_worker/
        # + league_manager/). Branch coverage is stricter than line; current branch
        # coverage is ~95%, so the gate floor is 94 (small margin for platform drift).
        run: |
          uv run pytest tests/ cop_worker/tests/ league_manager/tests/ \
            --cov=cop_worker --cov=league_manager --cov-branch \
            --cov-report=xml \
            --cov-fail-under=94
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: File size rule
        # The 150-line rule is documented in the README; nothing enforced it before
        # (ruff caps line length, not line count) so files drifted over it silently.
        # Ratchet: known-oversize files carry a justified allowance and may not grow.
        run: uv run python scripts/check_file_size.py
      - name: Secret scan
        run: |
          # Match real credential shapes only (length-bounded) to avoid false
          # positives on test fixtures (e.g. "sk-test") and scanner regex literals.
          # Scan OUR code only: .venv holds third-party sources and httpx's own
          # docstring example (username="jo@gmail.com", password=...) tripped
          # this gate on every run once uv sync populated it (2026-08-15).
          if grep -rEn "(AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{36}|gmail[^\n]{0,20}password)" --include="*.py" --include="*.json" --exclude-dir=.venv --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=__pycache__ .; then
            echo "Potential secret found"
            exit 1
          fi
          echo "No secrets found"
