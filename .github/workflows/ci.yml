name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Sync deps
        run: uv sync --frozen
      - name: Lock consistency
        run: uv lock --check
      - name: Run tests
        run: uv run pytest tests/ cop_worker/tests/ league_manager/tests/ -q --tb=short
      - name: Coverage
        # Real source packages after the 3-process restructure (agent/ -> cop_worker/
        # + league_manager/). Branch coverage is stricter than line: current line
        # coverage is ~85% and branch ~83%, so the gate floor is 80.
        run: |
          uv run pytest tests/ cop_worker/tests/ league_manager/tests/ \
            --cov=cop_worker --cov=league_manager --cov-branch \
            --cov-report=xml \
            --cov-fail-under=90
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Secret scan
        run: |
          # Match real credential shapes only (length-bounded) to avoid false
          # positives on test fixtures (e.g. "sk-test") and scanner regex literals.
          if grep -rEn "(AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{36}|gmail[^\n]{0,20}password)" --include="*.py" --include="*.json" .; then
            echo "Potential secret found"
            exit 1
          fi
          echo "No secrets found"
