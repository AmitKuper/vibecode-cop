<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">Counted six-gamelet production lifecycle</title>
  <desc id="desc">The two-process lifecycle from role CLIs through signed result reporting.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 12; }
      .accent { fill: #e0f2fe; stroke: #0369a1; }
      .secure { fill: #ecfdf5; stroke: #047857; }
      .text { font: 16px system-ui, sans-serif; fill: #0f172a; text-anchor: middle; }
      .small { font: 13px system-ui, sans-serif; fill: #334155; text-anchor: middle; }
      .line { stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1400" height="360" fill="#ffffff"/>
  <text x="700" y="35" class="text" style="font-weight:700;font-size:24px">Counted Production Lifecycle</text>
  <rect class="box accent" x="35" y="80" width="150" height="75"/>
  <text class="text" x="110" y="112">Cop CLI</text>
  <text class="small" x="110" y="136">independent process</text>
  <rect class="box accent" x="35" y="205" width="150" height="75"/>
  <text class="text" x="110" y="237">Thief CLI</text>
  <text class="small" x="110" y="261">independent process</text>
  <rect class="box" x="245" y="142" width="175" height="75"/>
  <text class="text" x="332" y="174">Orchestrators</text>
  <text class="small" x="332" y="198">COUNTED / exact six</text>
  <rect class="box secure" x="480" y="142" width="175" height="75"/>
  <text class="text" x="567" y="174">Signed Step-0</text>
  <text class="small" x="567" y="198">profile + identities</text>
  <rect class="box" x="715" y="142" width="190" height="75"/>
  <text class="text" x="810" y="174">Six Gamelets</text>
  <text class="small" x="810" y="198">belief + RL + mask</text>
  <rect class="box secure" x="965" y="142" width="175" height="75"/>
  <text class="text" x="1052" y="174">Audit + Result</text>
  <text class="small" x="1052" y="198">bilateral signatures</text>
  <rect class="box accent" x="1200" y="142" width="165" height="75"/>
  <text class="text" x="1282" y="174">Ledger + Gmail</text>
  <text class="small" x="1282" y="198">independent reports</text>
  <line class="line" x1="185" y1="117" x2="245" y2="164"/>
  <line class="line" x1="185" y1="242" x2="245" y2="195"/>
  <line class="line" x1="420" y1="179" x2="480" y2="179"/>
  <line class="line" x1="655" y1="179" x2="715" y2="179"/>
  <line class="line" x1="905" y1="179" x2="965" y2="179"/>
  <line class="line" x1="1140" y1="179" x2="1200" y2="179"/>
  <text class="small" x="810" y="265">LocalObservation + Bayesian BeliefState + recurrent champion</text>
  <text class="small" x="810" y="290">Commit-Reveal → canonical transition → comprehensive mutual audit</text>
  <text class="small" x="810" y="315">Any counted invariant failure aborts; no development fallback</text>
</svg>
