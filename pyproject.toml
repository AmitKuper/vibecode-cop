[project]
name = "cop-thief-game"
version = "3.0.0"
description = "Cop vs Thief game with crewAI agent orchestration with multiple LLM backends"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.6",
    "anthropic>=0.116.0",
    "fastmcp>=3.4.4",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "crewai>=0.1.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-api-python-client>=2.0",
    "fastapi>=0.110",
    "numpy>=1.26",
    "sympy>=1.14.0",
    "torch>=2.2",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
ollama = ["langchain-community>=0.0.15"]
openai = ["langchain-openai>=0.1.0"]
anthropic = ["langchain-anthropic>=0.1.0"]
azure = ["langchain-openai>=0.1.0"]
all-llms = [
    "langchain-community>=0.0.15",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "pytest-cov>=5",
    "coverage>=7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["N999"]

[tool.ruff.lint.per-file-ignores]
"cop_worker/gui/app.py" = ["E501"]
"cop_worker/replay/app.py" = ["E501"]
# E402: tests use pytest.skip(allow_module_level=True) before imports by design.
# The rest are idiomatic in tests: blind-exception asserts (B017), unused loop/
# locals (B007/F841), uppercase constants (N806), and style suggestions (SIM105/
# SIM117) that hurt test readability.
"tests/*.py" = ["E402", "B017", "B007", "F841", "N806", "SIM105", "SIM117"]
"cop_worker/tests/*.py" = ["E402", "B017", "B007", "F841", "N806", "SIM105", "SIM117"]
"league_manager/tests/*.py" = ["E402", "B017", "B007", "F841", "N806", "SIM105", "SIM117"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "cop_worker/tests", "league_manager/tests"]
pythonpath = ["."]

[tool.coverage.run]
omit = [
    # GUI and replay launcher entrypoints — visual-only, not unit-testable.
    "cop_worker/gui/app.py",
    "cop_worker/replay/app.py",
    # Canonical replay/tamper-verification module is unimportable (stale
    # cop_worker.mcp.crypto import); dead entrypoint, flagged for hand-off fix.
    "cop_worker/replay/replay_app.py",
    # Process launchers — arg parsing + server bootstrap, not library code.
    "cop_worker/__main__.py",
    "league_manager/__main__.py",
    # Scripts are integration entrypoints, not library code.
    "scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
