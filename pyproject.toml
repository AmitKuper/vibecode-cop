[project]
name = "cop-thief-game"
version = "0.1.0"
description = "Cop vs Thief game with crewAI agent orchestration with multiple LLM backends"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.6",
    "anthropic>=0.116.0",
    "fastmcp>=3.4.4",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "crewai>=0.1.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-api-python-client>=2.0",
]

[project.optional-dependencies]
ollama = ["langchain-community>=0.0.15"]
openai = ["langchain-openai>=0.1.0"]
anthropic = ["langchain-anthropic>=0.1.0"]
azure = ["langchain-openai>=0.1.0"]
all-llms = [
    "langchain-community>=0.0.15",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
]
rl = [
    "numpy>=1.26",
    "torch>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["N999"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
