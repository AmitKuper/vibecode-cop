[project]
name = "cop-thief-game"
version = "0.1.0"
description = "Cop vs Thief game with crewAI agent orchestration with multiple LLM backends"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.6",
    "anthropic>=0.116.0",
    "fastmcp>=3.4.4",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "crewai>=0.1.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-api-python-client>=2.0",
    "fastapi>=0.110",
]

[project.optional-dependencies]
ollama = ["langchain-community>=0.0.15"]
openai = ["langchain-openai>=0.1.0"]
anthropic = ["langchain-anthropic>=0.1.0"]
azure = ["langchain-openai>=0.1.0"]
all-llms = [
    "langchain-community>=0.0.15",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
]
rl = [
    "numpy>=1.26",
    "torch>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "pytest-cov>=5",
    "coverage>=7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["N999"]

[tool.ruff.lint.per-file-ignores]
"agent/gui/app.py" = ["E501"]
"agent/replay/app.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "agent/tests"]
pythonpath = ["."]

[tool.coverage.run]
omit = [
    "agent/rl/train*.py",
    "agent/rl/trainer.py",
    "agent/rl/league.py",
    "agent/rl/ppo.py",
    "agent/rl/ppo_update.py",
    "agent/rl/dqn.py",
    "agent/rl/rollout.py",
    "agent/rl/replay_buffer.py",
    "agent/rl/cross_train.py",
    "agent/rl/eval_compare.py",
    "agent/rl/evaluate.py",
    "agent/rl/strategies*.py",
    "agent/skills/game_*.py",
    "agent/reports/gmail*.py",
    "agent/reports/email_report.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
