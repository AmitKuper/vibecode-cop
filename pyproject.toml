[project]
name = "cop-thief-game"
version = "3.0.0"
description = "Cop vs Thief game with crewAI agent orchestration with multiple LLM backends"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.6",
    "anthropic>=0.116.0",
    "fastmcp>=3.4.4",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "crewai>=0.1.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-api-python-client>=2.0",
    "fastapi>=0.110",
    "numpy>=1.26",
    "sympy>=1.14.0",
    "torch>=2.2",
]

[project.optional-dependencies]
ollama = ["langchain-community>=0.0.15"]
openai = ["langchain-openai>=0.1.0"]
anthropic = ["langchain-anthropic>=0.1.0"]
azure = ["langchain-openai>=0.1.0"]
all-llms = [
    "langchain-community>=0.0.15",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "pytest-cov>=5",
    "coverage>=7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["N999"]

[tool.ruff.lint.per-file-ignores]
"agent/gui/app.py" = ["E501"]
"agent/replay/app.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "agent/tests"]
pythonpath = ["."]

[tool.coverage.run]
omit = [
    # Superseded pre-GRU experiment stack; the counted RecurrentA2C trainer,
    # evaluator, loader, and inference path are deliberately measured.
    "agent/rl/train.py",
    "agent/rl/train_advanced.py",
    "agent/rl/train_cli.py",
    "agent/rl/train_config.py",
    "agent/rl/train_multi.py",
    "agent/rl/train_selfplay.py",
    "agent/rl/trainer.py",
    "agent/rl/league.py",
    "agent/rl/ppo.py",
    "agent/rl/ppo_update.py",
    "agent/rl/dqn.py",
    "agent/rl/rollout.py",
    "agent/rl/replay_buffer.py",
    "agent/rl/cross_train.py",
    "agent/rl/eval_compare.py",
    "agent/rl/evaluate.py",
    "agent/rl/strategies.py",
    "agent/rl/strategies_base.py",
    "agent/rl/strategies_combo.py",
    "agent/rl/strategies_qtable.py",
    # Historical generated discovery snapshots, never imported by the composition root.
    "agent/skills/game_game_20260801_011757_f0450bda_mcp.py",
    "agent/skills/game_game_20260801_012126_eafdb10d_mcp.py",
    "agent/skills/game_game_20260801_045923_2cd89753_mcp.py",
    "agent/skills/game_game_20260801_050125_2ddba68d_mcp.py",
    "agent/skills/game_game_20260801_135945_3abcf9a7_mcp.py",
    # Disabled legacy SMTP plugin; counted reporting uses gmail_*.py through Gatekeeper.
    "agent/reports/email_report.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
