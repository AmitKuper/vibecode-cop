# ================================================================
# vibecode-cop — RUNTIME profile for the imreeyal pairing
# Friendly: 2026-08-10 20:00 Israel time (uncounted). Their brief:
# reports to EACH OTHER only, never the lecturer, for the friendly.
# Select with:  --config imreeyal
# ================================================================

[network]
our_cop_port      = 61224
our_thief_port    = 61223
our_cop_mcp_url   = "http://62.56.220.143:61224/mcp"
our_thief_mcp_url = "http://62.56.220.143:61223/mcp"

# imreeyal endpoints (their §2; both hostnames terminate on one process).
opponent_group = "imreeyal"
opp_cop_url    = "https://cop.imreeyal.com/mcp"
opp_thief_url  = "https://thief.imreeyal.com/mcp"

[protocol]
# Locked at Step-0 for this pairing: their §3.12 proposal, accepted (we retrained for
# it — see docs/CLAUDE_SCORE100_EXECPLAN.md 2026-08-09/10). Declares the kit-recomputed
# 81ebee59… hash; drives our emission physics AND which promoted artifact may load
# (obs-mode guard). tie_rule series_add is declared in the written pairing agreement.
scent_model = "subtractive_chebyshev_v1"
# Minimax over exact chebyshev tracking (the frame's unique peak IS the emitter's
# cell), RL fallback on blind frames. Plain "rl" remains available as a kill switch.
move_policy = "hybrid_search"

[timeouts]
agreement_poll_sec = 300.0
turn_poll_sec      = 120.0   # their turn timeout is 180s; we give up first, on purpose
audit_poll_sec     = 300.0
endpoint_await_sec = 900.0
probe_sec          = 30.0
introspect_sec     = 30.0
port_wait_sec      = 15.0
git_rev_parse_sec  = 10.0
retry_backoff_sec  = 8.0
poll_interval_sec  = 0.05
reorder_window     = 4
# Per-call MCP cap, STRICTLY below the signed response_timeout_sec (30) — their §3.5
# scar: the SDK default can breach a signed deadline while every call "looks fine".
mcp_call_sec       = 10.0
mcp_call_retries   = 6

[llm]
provider       = "ollama"
model          = "llama3.1:8b"
base_url       = "http://localhost:11434"
temperature    = 0.7
num_predict    = 30
hint_timeout_sec = 6.0
keep_alive     = "30m"

[identity]
group_id   = "vibecode"
group_name = "vibecode"
members    = ["Ron Marom", "Amit Kuperminz"]
cop_repo   = "https://github.com/AmitKuper/vibecode-cop"
thief_repo = "https://github.com/AmitKuper/vibecode-thief"

[report]
# FRIENDLY: our own inbox + theirs is added at send time per their §1 answer.
# NEVER the lecturer for an uncounted game (their §6, our standing rule).
recipient  = "agentsorch@gmail.com"
mode       = "send"
token_path = "secrets/gmail/token.json"

[counted]
counted_played = 1
