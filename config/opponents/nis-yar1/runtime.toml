# nis-yar1 pairing — two separate peer processes, two cloudflared quick-tunnel URLs.
# Their URLs ROTATE on restart and arrive ~10 min before each T: fill opp_*_url then.
[network]
our_cop_port      = 61224
our_thief_port    = 61223
our_cop_mcp_url   = "http://62.56.220.143:61224/mcp"
our_thief_mcp_url = "http://62.56.220.143:61223/mcp"

opponent_group = "nis-yar1"
opp_cop_url    = "FILL-AT-T"
opp_thief_url  = "FILL-AT-T"

[protocol]
scent_model  = "subtractive_chebyshev_v1"
move_policy  = "hybrid_search"
mcp_call_sec = 10.0

[report]
# FRIENDLY: to each other only — their operator inbox; our copy = Gmail Sent record.
recipient  = "nissimderi123@gmail.com"
mode       = "send"
token_path = "secrets/gmail/token.json"

[counted]
counted_played = 3
