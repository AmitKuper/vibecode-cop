opponent_group = "cosmos77"
opp_cop_url    = "https://cosmos77-arena-production.up.railway.app/mcp"
opp_thief_url  = "https://cosmos77-arena-production.up.railway.app/mcp"

[protocol]
# Locked in their greeting: subtractive_chebyshev_v1 (0.8-peak
# after-one-decay — kit-exact, matches our ChebyshevTrail), wire reference-v3.
# Our NATIVE sighted regime: minimax + squeeze + corridor need no decoder.
scent_model  = "subtractive_chebyshev_v1"
move_policy  = "hybrid_search"
# Their thief = PARKER (g02 dwell: 22 straight steps at (2,5), moves only
# when adjacent). Measured 2026-08-22 parker_chains_lab vs a faithful
# replica: plain (squeeze+minimax, NO plan layer) captures from the real
# (3,3) start @23 at wire depth 3; hunt and corridor both survive — the
# plan layers hijack the override slot and stall the very chase that
# converts. Their counted SHAs are frozen = the parker plays the counted.
cop_chain    = "plain"
mcp_call_sec = 10.0

[timeouts]
# 10s, NOT 120: this is the wait-for-their-greeting timeout = our re-dial
# cadence. Their reply-dialect peer seals instantly from our dial and starts
# its signed 30s turn clock; a 120s wait meant our seal (their greeting
# arriving) came after their session died -> our turn 1 hit a dead session
# (the sg1 McpError->404 signature, three counted attempts). At 10s each
# re-dial refreshes their session until both seals land seconds apart.
agreement_poll_sec = 10.0
# Their cop worker arms slowly after doors-up: sg1 receive_turn refused for
# ~13s (6 attempts) in BOTH counted attempts, while sg3+ (their cop again)
# worked — arm time is between 13s and ~90s. 16 attempts = ~60s of patience
# (0.5,1,2,4,5,5,...) absorbs it unilaterally. Per-pairing only.
mcp_call_retries   = 16

