# ONE process, both roles, ONE static ngrok domain (does not rotate) — both
# opp URLs point at the same endpoint (single-door peer precedent). Between windows
# it answers 502; during a window a bare probe answers 406. They REFUSE
# dials from unconfigured groups and outside agreed windows.
# OPEN ITEM before any game: ROLE PARITY — their rule (alpha-first = police
# on odd) makes vibecode police on 1/3/5; our driver hardcodes thief-on-odd.
# Reconciliation requested in the greeting reply; do NOT schedule before it
# is settled in writing.
[network]
