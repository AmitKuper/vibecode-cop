# yanell11 pairing (Itay? — members TBD from their Step-0).
# Their tunnel URL rotates per restart and arrives in chat right before each
# match — fill opp_*_url then. Scent model AGREED in writing 2026-08-21:
# multiplicative_book_v1 (sha 934c220d…), both greetings declare it. Turn
# order: thief-first proposed with kit citations (be96e57 playbook L65/501,
# netplay.py:263, turnloop.py docstring, series.py:124) — awaiting their
# written confirmation; do NOT schedule a window before it lands.
[network]
ingress           = "ngrok"
our_cop_port      = 61224
our_thief_port    = 61223

opponent_group = "yanell11"
# opp_cop_url is dialled when WE are thief (their cop answers), and vice versa.
opp_cop_url    = "FILL_FROM_CHAT_BEFORE_MATCH"
opp_thief_url  = "FILL_FROM_CHAT_BEFORE_MATCH"

[protocol]
# Locked book model: the search stack stays sighted via the exact wire-law
# inverse (cop_worker/scent_decoder via opponent_fix) — observation-side only,
# nothing we transmit changes. hybrid_search = minimax+stall-squeeze first,
# RL fallback on ambiguous frames.
scent_model  = "multiplicative_book_v1"
move_policy  = "hybrid_search"
mcp_call_sec = 10.0

[timeouts]
agreement_poll_sec = 120.0

[report]
# FRIENDLY: operator-to-operator only, never the league inbox (their doc
# agrees: "neither side mailed anything to the league inbox").
recipient  = "FILL_THEIR_OPERATOR_INBOX"
mode       = "send"
token_path = "secrets/gmail/token.json"

[counted]
counted_played = 8
