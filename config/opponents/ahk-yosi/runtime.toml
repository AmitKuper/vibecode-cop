# ================================================================
# vibecode-cop — RUNTIME configuration (NOT part of any SHA)
# ================================================================
# This file holds every runtime/operational parameter for a match:
# network endpoints, timeouts, LLM settings, identity, and reporting.
#
# It is deliberately SEPARATE from config/game.json:
#   - game.json  = the shared constitution. Its whole-file canonical
#                  SHA (config_sha256) is exchanged and must match the
#                  opponent. See config/README.md.
#   - runtime.toml = private to us. Never hashed, never shared. Edit
#                    freely; it changes HOW we run, not the game rules.
#
# On the next game, ALL main operational params live here. Select a
# profile with `--config <name>` (loads config/opponents/<name>/ if it
# exists, else this base). CLI flags always override these values.
# ================================================================

# Semantic version of this runtime-config schema.
config_version = "1.0.0"

[network]
# Our two MCP servers. The local listeners never move; only the PUBLIC URL we
# declare to the opponent changes with `ingress`:
#   "ngrok"            — declare a live tunnel URL instead, read from the
#                        agent API. The free plan has ONE domain, so only
#                        ONE door can be tunnelled; the other still falls
#                        back to the IP. See docs/NGROK_INGRESS.md.
#   "static" (default) — the router-forwarded public IP below. Both doors
#                        reachable, permanent, nothing to keep running.
# If ngrok is selected but no tunnel is up, we fall back to the static IP for
# that role and print why; a match never fails over ingress.
# Setting our_cop_mcp_url / our_thief_mcp_url explicitly overrides both modes.
ingress           = "static"
our_cop_port      = 61224
our_thief_port    = 61223

# Default opponent (override per game with --opponent-group / --opp-*-url
# or a saved config/opponents/<group>/runtime.toml).
opponent_group = "anrbj666"
opp_cop_url    = "https://cop-mcp.alon.website/mcp"
opp_thief_url  = "https://thief-mcp.alon.website/mcp"

# Live GUI per role worker (local truth only, 127.0.0.1) - ALWAYS ON by
# default (decision 2026-08-16, docs/GUI_PRD.md R5). Fail-open: a dead GUI or a
# busy port is a logged skip and can never delay or block a move. Comment these
# out to disable; play is byte-identical either way.
gui_cop_port   = 8781
gui_thief_port = 8782

[protocol]
# The pairing defaults. Every opponent profile repeats these explicitly, but the
# BASE file must carry them too: without a [protocol] section the CLI fell back
# to multiplicative_book_v1 + move_policy "rl", so a bare --self-test loaded the
# chebyshev-trained champion under the book field and refused with
# CountedPolicyLoadError - i.e. the README's own quick-start command failed
# (found 2026-08-15). These values match what we have played every series on.
scent_model  = "subtractive_chebyshev_v1"
move_policy  = "hybrid_search"
mcp_call_sec = 10.0

[timeouts]
# All seconds unless noted. Previously hardcoded in scripts/live_match_ref3.py.
agreement_poll_sec = 300.0   # wait for the peer's negotiation greeting
turn_poll_sec      = 120.0   # wait for the peer's sealed turn
audit_poll_sec     = 300.0   # wait for the peer's end-of-game audit
endpoint_await_sec = 900.0   # wait for a per-window opponent endpoint to come up
probe_sec          = 30.0    # transport probe deadline (tunnelled peers are slow)
introspect_sec     = 30.0    # MCP introspect deadline
port_wait_sec      = 15.0    # wait for our own local server ports to open
git_rev_parse_sec  = 10.0    # subprocess timeout for git rev-parse
retry_backoff_sec  = 8.0     # endpoint re-dial backoff on 502/530/refused
poll_interval_sec  = 0.05    # inner poll sleep granularity
reorder_window     = 4       # ReferenceV3Inbox bounded-reorder window

[llm]
# Movement is always the RL policy; the LLM only writes free-text hints.
provider       = "ollama"
model          = "llama3.1:8b"
base_url       = "http://localhost:11434"
temperature    = 0.7
num_predict    = 30          # max tokens per hint
hint_timeout_sec = 6.0       # warm calls ~2.5s; cold load needs headroom
keep_alive     = "30m"       # keep the model resident (avoids GPU cycling)

[identity]
# What the peer records about us (rules 49/53) and what the declaration carries.
group_id   = "vibecode"
group_name = "vibecode"
members    = ["Ron Marom", "Amit Kuperminz"]
cop_repo   = "https://github.com/AmitKuper/vibecode-cop"
thief_repo = "https://github.com/AmitKuper/vibecode-thief"

[report]
# SAFETY: the default recipient is OUR OWN inbox. The league/counted address
# is NEVER stored here or defaulted anywhere — it is passed explicitly at run
# time (--report-to) for a counted game only. See config/README.md.
recipient  = "agentsorch@gmail.com"
mode       = "send"                       # "send" | "dry_run" | "none"
token_path = "secrets/gmail/token.json"

[counted]
# Our prior counted-games count (rules 37-38), sourced from the ledger
# results/counted_series.json. games_played_including_this = this + (counted?1:0).
counted_played = 1
