# ahk-yosi pairing (Yosef Shanaa + 1 — full names PENDING from them).
# ONE peer process serving BOTH roles behind a single cloudflare quick-tunnel
# URL, alternating role per sub-game. So opp_cop_url == opp_thief_url here;
# our dialer picks the right one per window and both resolve to that one door.
# Quick-tunnels ROTATE on restart: re-confirm the URL in writing before each T.
[network]
# Static IP is the default ingress; set ingress = "ngrok" here to declare
# a live tunnel URL instead (one door only - see docs/NGROK_INGRESS.md).
ingress           = "static"
our_cop_port      = 61224
our_thief_port    = 61223

opponent_group = "ahk-yosi"
# PROVISIONAL (their word): live and returning 502 while their peer is down,
# which is exactly what our 502/530 re-dial backoff expects.
opp_cop_url    = "https://equation-classifieds-slides-organized.trycloudflare.com/mcp"
opp_thief_url  = "https://equation-classifieds-slides-organized.trycloudflare.com/mcp"

[protocol]
# They recomputed subtractive_chebyshev_v1 independently and got our
# 81ebee59...ddf4 byte-for-byte, so the model is agreed before Step-0.
scent_model  = "subtractive_chebyshev_v1"
move_policy  = "hybrid_search"
mcp_call_sec = 10.0

[timeouts]
# Greeting poll shorter than the 300s index-hold so a quiet window retries with
# a fresh drain instead of one long wait (najamjad lesson).
agreement_poll_sec = 120.0

[report]
# FRIENDLY: to each other, never the lecturer. Both sides first declared
# own-inbox-only; changed by agreement 2026-08-18 to a mutual exchange, so
# each side can read the other's report instead of taking it on trust.
recipient  = "apexmediamind@gmail.com"
mode       = "send"
token_path = "secrets/gmail/token.json"

[counted]
counted_played = 6
