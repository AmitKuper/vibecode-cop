# peersim01 — REALISTIC PEER SIMULATOR (bench-only, localhost). Single-URL peer
# like najamjad/uoh-sqak: ONE port (9377) serves every window; we point both
# opponent-role slots at it. Start `uv run python scripts/peer_sim.py` first,
# then run the match WITH --no-email (the recipient below is a dummy):
#   uv run python scripts/live_match_ref3.py --match --config peersim --no-email
[network]
# Declared URLs come from the default ingress (ngrok, resolved live);
# set ingress = "static" here to declare the router-forwarded IP instead.
ingress           = "ngrok"
our_cop_port      = 61224
our_thief_port    = 61223

opponent_group = "peersim01"
opp_cop_url    = "http://127.0.0.1:9377/mcp"
opp_thief_url  = "http://127.0.0.1:9377/mcp"

[protocol]
scent_model  = "subtractive_chebyshev_v1"
move_policy  = "hybrid_search"
mcp_call_sec = 10.0

[timeouts]
# Local bench: fail fast instead of the 300-900s live-peer defaults.
agreement_poll_sec = 45.0
endpoint_await_sec = 60.0
subgame_hold_sec   = 120.0

[report]
# Bench profile: NEVER emailed — run with --no-email; recipient is a dummy.
recipient  = "peersim-dummy@example.invalid"
mode       = "send"
token_path = "secrets/gmail/token.json"
