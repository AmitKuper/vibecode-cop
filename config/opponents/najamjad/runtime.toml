# najamjad pairing — single-process peer: ONE URL for all six windows.
# They serve every role from cop.4laboratory.com; we point both opponent-role
# slots at it. Cloudflare NAMED tunnel (stable — no rotation). FRIENDLY.
[network]
# Static IP is the default ingress; set ingress = "ngrok" here to declare
# a live tunnel URL instead (one door only - see docs/NGROK_INGRESS.md).
ingress           = "static"
our_cop_port      = 61224
our_thief_port    = 61223

opponent_group = "najamjad"
opp_cop_url    = "https://cop.4laboratory.com/mcp"
opp_thief_url  = "https://cop.4laboratory.com/mcp"

[protocol]
scent_model  = "subtractive_chebyshev_v1"
move_policy  = "hybrid_search"
mcp_call_sec = 10.0

[timeouts]
# Greeting poll shorter than the 300s index-hold so a quiet window gets a second
# attempt (with a fresh drain + door self-check) instead of one 300s wait.
agreement_poll_sec = 120.0

[report]
# FRIENDLY: to each other only — their operator inbox; our copy = Gmail Sent record.
recipient  = "najikayal4@gmail.com"
mode       = "send"
token_path = "secrets/gmail/token.json"

[counted]
counted_played = 4
